name: security-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-scanners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt

      - name: Regression tests (the fixes hold)
        run: pytest -q

      - name: Semgrep rule self-test (the detectors work)
        run: semgrep --test --config semgrep/rules.yaml semgrep/rules.py

      - name: Semgrep scan (no insecure patterns in app/)
        run: semgrep --error --config semgrep/rules.yaml app/

      - name: Bandit (common insecure patterns)
        run: bandit -r app/

      - name: pip-audit (known CVEs in dependencies)
        run: pip-audit -r requirements.txt
